name: CAPABILITY_INGEST_TEST_002 routing PR gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'capability-ingest/task-level-model-routing-test.py'
      - '.github/workflows/capability-ingest-test-002-routing-pr.yml'

permissions:
  contents: read

jobs:
  routing-gate:
    name: Deterministic task-level model routing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run bounded routing test
        run: python3 capability-ingest/task-level-model-routing-test.py
