name: Hidden Roadmap P4-P5 Seal

on:
  push:
    branches:
      - bench/hidden-roadmap-pilot-controls
    paths:
      - .github/workflows/hidden-roadmap-p4p5-seal.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout public control branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Checkout custody branch without printing contents
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: custody/hidden-roadmap-p2-v0.1
          path: custody
          fetch-depth: 1

      - name: Set up exact Python for syntax validation
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.13'

      - name: Syntax validate hidden verifier files
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile custody/99-custody/hidden-roadmap-p2-v0.1/verifier/F01_acceptance.py
          python -m py_compile custody/99-custody/hidden-roadmap-p2-v0.1/verifier/F02_acceptance.py
          python -m py_compile custody/99-custody/hidden-roadmap-p2-v0.1/verifier/F03_acceptance.py
          python -m py_compile custody/99-custody/hidden-roadmap-p2-v0.1/verifier/F04_acceptance.py
          python -m py_compile custody/99-custody/hidden-roadmap-p2-v0.1/verifier/F05_acceptance.py

      - name: Generate custody commitment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cd custody/99-custody/hidden-roadmap-p2-v0.1/verifier
          sha256sum \
            F01_acceptance.py \
            F02_acceptance.py \
            F03_acceptance.py \
            F04_acceptance.py \
            F05_acceptance.py \
            P5_NFI_FULL_v0.1.md \
            > "${GITHUB_WORKSPACE}/evidence/P4_P5_FILE_HASHES.txt"
          cd "${GITHUB_WORKSPACE}"
          sha256sum evidence/P4_P5_FILE_HASHES.txt > evidence/P4_P5_COMMITMENT.txt
          printf 'custody_branch=%s\n' 'custody/hidden-roadmap-p2-v0.1' > evidence/identity.txt
          git -C custody rev-parse HEAD >> evidence/identity.txt

      - name: Upload seal evidence
        uses: actions/upload-artifact@v4
        with:
          name: hidden-roadmap-p4p5-seal
          path: evidence/**
          if-no-files-found: error
          retention-days: 30
